# ============================================================
# 本地端口避让覆盖（此文件被 .gitignore 忽略，不会提交/推送）
#
# 原因：宿主机 6379(Redis) 与 8000(后端) 已被你其它项目的容器占用，
#       直接 docker compose up 会报 "port is already allocated"。
# 作用：仅把这两个服务的“宿主端口”挪开；容器内部端口与服务名不变，
#       因此 前端代理 / 后端连 postgres、redis 的内部链路都不受影响。
# ============================================================
services:
  redis:
    ports: !override
      - "6380:6379"     # 宿主 6380 -> 容器 6379
  backend:
    ports: !override
      - "8001:8000"     # 宿主 8001 -> 容器 8000（访问 http://localhost:8001/docs）
